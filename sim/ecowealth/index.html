<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>
      EcoWealth Simulator: Indirect Referral + General Harvest + Team Harvest +
      Royalty + Unilevel
    </title>
    <style>

        --bg: #eef1f6;
        --pan: #fff;
        --ink: #1c2340;
        --mut: #65708a;
        --line: #d5dbe8;
        --ok: #1f8a5b;
        --amb: #b7791f;
        --hi: #e8ecfb;
        --btn: #2b3a8c;
        --btnink: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #10142a;
          --pan: #181e3a;
          --ink: #e7eaf7;
          --mut: #94a0c2;
          --line: #2a3358;
          --ok: #4fd39a;
          --amb: #e7b45a;
          --hi: #212a54;
          --btn: #8fa2ff;
          --btnink: #10142a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #10142a;
        --pan: #181e3a;
        --ink: #e7eaf7;
        --mut: #94a0c2;
        --line: #2a3358;
        --ok: #4fd39a;
        --amb: #e7b45a;
        --hi: #212a54;
        --btn: #8fa2ff;
        --btnink: #10142a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0.2em 0;
      }
      h2 {
        font-size: 1.05rem;
        margin: 0 0 0.6em;
      }
      .mut {
        color: var(--mut);
      }
      .err {
        background: #fde8e8;
        color: #8a1f1f;
        padding: 8px 12px;
        border-radius: 6px;
      }
      .pan {
        background: var(--pan);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px 16px;
        margin: 14px 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--pan);
        margin-top: 14px;
      }
      .stats div {
        flex: 1 1 150px;
        padding: 12px 16px;
        border-right: 1px solid var(--line);
      }
      .stats div:last-child {
        border-right: 0;
      }
      .stats b {
        display: block;
        font-size: 1.4rem;
      }
      label {
        display: block;
        margin: 0 0 10px;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 8px 14px;
        border: 0;
        border-radius: 5px;
        background: var(--btn);
        color: var(--btnink);
        cursor: pointer;

      button.sec {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--btn);
        outline-offset: 2px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: end;
      }
      .row input {
        width: auto;
        flex: 1 1 160px;
        margin: 0;
      }
      .row .n {
        flex: 0 0 90px;
      }
      .g2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px;
      }
      .sc {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        font-weight: 600;
        color: var(--mut);
      }
      tr.me td {
        background: var(--hi);
      }
      .ok {
        color: var(--ok);
        font-weight: 600;
      }
      .bar {
        width: 110px;
        height: 8px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--amb);
      }
      :root {
        --tok: #4fd39a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --tok: #1f8a5b;
        }
      }
      :root[data-theme="dark"] {
        --tok: #1f8a5b;
      }
      :root {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      a {
        color: var(--btn);
      }
      select {
        font: inherit;
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      .row select {
        width: auto;
        flex: 1 1 140px;
        margin: 0;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .pgr {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 16px;
        padding-top: 10px;
      }
      .pbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;

      .pb {

        height: 36px;

        color: var(--ink);
        border: 1px solid var(--line);

      .pb.cur {

        color: var(--btnink);

      }
      .rpp {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font-weight: 400;
      }
      .rpp select {
        padding: 6px 8px;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      select:focus-visible {
        outline: 2px solid var(--btn);
        outline-offset: 2px;
      }
      @media (pointer: coarse) {
        .pb {
          min-width: 44px;
          height: 44px;
        }
      }
      #toasts {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(92vw, 420px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        z-index: 10;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--ink);
        color: var(--bg);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        animation: tin 0.18s ease-out;
      }
      .toast .ti {
        color: var(--tok);
        font-weight: 700;
      }
      .toast span:nth-child(2) {
        flex: 1;
      }
      .toast button {
        padding: 0 6px;
        background: none;
        color: inherit;
        font-size: 1.2rem;
        line-height: 1;
      }
      .toast button:focus-visible {
        outline-color: currentColor;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .toast.out {
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        .toast {
          animation: none;
        }
        .toast.out {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="alerts" class="sr" role="alert"></div>
    <script>
      // EcoWealth Simulator - five independent bonus systems sharing one sponsor tree and one
      // registration event. New to this file? Start here, then the comment above each function fills
      // in the specifics. (The page title lists all five; this file predates two of them and the
      // comment used to say "three" - this block is the fix for that, kept in sync with what's below.)
      //
      // THE SHARED TREE. Every member is one entry in S.users: {id, name, sp}, where sp is the
      // sponsoring member's id. Company (id 0) is the root; it never earns or qualifies for anything,
      // and can never log in. Every system below reads this one tree - none of them keep a separate
      // copy of who sponsored whom.
      //
      // THE FIVE SYSTEMS, roughly in the order a new member would encounter them:
      //
      //  1. INDIRECT REFERRAL BONUS - a flat, one-time, unconditional payout, instantly, the moment a
      //     new member registers. Pays up to 10 levels of REAL sponsors above the new member
      //     (INDIRECT_BONUS: 500/100/50/40/30/20/10/5/5/5), no quota or rank required, same amount
      //     regardless of anyone's history. See payIndirectReferral().
      //
      //  2. GENERAL HARVEST - one shared 3-wide, 10-level matrix for the WHOLE network. Sponsoring 3
      //     directs "qualifies" a member and adds them to the Harvest queue (S.mx); the first-ever
      //     member to qualify becomes the matrix's permanent apex (queue position 0, paid from the
      //     whole network's later qualifiers), and everyone else fills the matrix in queue order,
      //     breadth-first. See levelsG()/earnedG().
      //
      //  3. TEAM HARVEST - every Harvest-qualified member ALSO gets their own private 3x10 matrix,
      //     filled only by their downline who qualified for Harvest AFTER they did - qualifying early
      //     matters, since a team can never include someone who beat its own apex to qualifying. Same
      //     matrix shape and bonus-per-level idea as General Harvest, just a different, personal
      //     population. See levelsT()/earnedT()/counts()/team().
      //
      //  4. ROYALTY - a rank ladder, Member -> Leader -> Supervisor -> Manager -> Director, that is
      //     completely independent of Harvest qualification: it is driven purely by TEAM COMPOSITION
      //     (how many downline members, at any depth, already hold the rank below you), not by the
      //     3-direct Harvest gate. A member can be Harvest-qualified (3+ directs) without being a
      //     Royalty Leader (10+ directs) yet, or the reverse. Ranks are permanent once reached.
      //     Supervisor, Manager and Director also earn a monthly peso royalty - evaluated once a month,
      //     on demand, via "Advance month" - based on their team's repeat-purchase sales against a
      //     per-rank quota. See ranks()/payout()/evaluateMonth().
      //
      //  5. UNILEVEL REPEAT-PURCHASE BONUS - pays a percentage of EVERY personal purchase, instantly,
      //     in real time: Level 0 (10%) always goes to the buyer themselves, and Levels 1-10
      //     (5/5/5/3/3/2/2/2/1/1%) go up the sponsor chain, one level each, but only to uplines who are
      //     currently "Active". Active/Inactive is a monthly flag (S.unilevelFlag), decided once a
      //     month from that member's OWN personal sales the month before, against a flat ₱500 quota -
      //     independent of rank, independent of Royalty's own quotas. Crucially, a member who has never
      //     been checked yet (month 1, or just-registered) reads as Active by default, not Inactive -
      //     only an evaluated month under quota switches someone to Inactive. See
      //     recordPurchase()/evaluateMonth().
      //
      // HOW THE FIVE SYSTEMS INTERACT:
      //  - A single registration (reg(), or bulkAdd() for many at once) can trigger Harvest
      //    qualification, a Royalty rank-up, AND an Indirect Referral payout, all in one event - see the
      //    combined toasts built in doReg()/under()/doBulk().
      //  - A single personal purchase (recordPurchase()) feeds Royalty's group-sales figure (read later,
      //    at month-end) AND pays Unilevel instantly, in the same call.
      //  - "Advance month" (doAdvance() -> evaluateMonth()) does exactly two things: pays Royalty, and
      //    recomputes next month's Unilevel Active/Inactive flags. It creates no purchases of its own
      //    and never touches Harvest, Indirect Referral, or the matrices.
      //  - "Auto-purchase" (doAutoPurchase() -> autoPurchasePass()) is the ONLY thing that simulates new
      //    purchases in bulk, and is a deliberately separate action from "Advance month" - this used to
      //    be bundled into Advance month, which made Unilevel's real-time payouts impossible to test
      //    with precise, chosen amounts (an auto-purchase could land on anyone, at a random time,
      //    between a controlled test's steps). Splitting them means Advance month is now a pure,
      //    predictable evaluation step, and Auto-purchase is an explicit, optional bulk-activity
      //    simulator that still pays Unilevel in real time, exactly like a manual purchase would.
      //
      // HOW THIS FILE IS LAID OUT, top to bottom: constants -> state shape & persistence ->
      // registration & Indirect Referral -> Harvest matrix maths -> Royalty rank & payout maths ->
      // Unilevel real-time payout & monthly eligibility -> sponsor-pattern bulk registration ->
      // toast/focus/pagination UI helpers -> dash() (the whole logged-in page) and authView() (the
      // logged-out page) -> event handlers wired to the HTML's onclick/onsubmit attributes -> render(),
      // the single entry point that redraws the page after every state change.
      // General and Team Harvest's per-level bonus amounts, index = level (1-10), index 0 unused.
      // T(L) is the matrix's slot formula: level L has exactly 3^L slots.
      const BONUS_G = [
        0, 2e3, 4e3, 8e3, 12e3, 25e3, 1e5, 25e4, 48e4, 25e5, 5e6,
      ];
      const BONUS_T = [0, 1e3, 2e3, 4e3, 6e3, 12e3, 5e4, 12e4, 2e5, 12e5, 35e5];
      const T = (n) => 3 ** n;
      // Royalty's three paid ranks: the monthly Group Sales quota each must clear, and the two
      // percentages (of Group Sales, and of the rank-holder's own Personal Sales) paid once it is.
      const RANK_QUOTA = {
        Supervisor: 500000,
        Manager: 1000000,
        Director: 5000000,
      };
      const GROUP_PCT = { Supervisor: 0.03, Manager: 0.05, Director: 0.1 };
      const PERSONAL_PCT = { Supervisor: 0.05, Manager: 0.1, Director: 0.15 };
      // Auto-purchase's simulated activity: ~PUR_RATE of the network buys a random amount each pass,
      // in PUR_MIN..PUR_MAX, rounded to the nearest 100.
      const PUR_RATE = 0.3,
        PUR_MIN = 500,
        PUR_MAX = 5000;
      // Unilevel's per-level rate on every personal purchase, index = level. Index 0 is the buyer's
      // own cut (always paid); indices 1-10 go to sponsors above them (paid only while Active).
      // UNILEVEL_QUOTA is the flat monthly personal-sales figure that decides next month's Active
      // status - unrelated to Royalty's own, per-rank quotas in RANK_QUOTA above.
      const UNILEVEL_PCT = [
        0.1, 0.05, 0.05, 0.05, 0.03, 0.03, 0.02, 0.02, 0.02, 0.01, 0.01,
      ];
      const UNILEVEL_QUOTA = 500;
      // Indirect Referral's flat per-level payout on every registration, index = level (1-10).
      const INDIRECT_BONUS = [0, 500, 100, 50, 40, 30, 20, 10, 5, 5, 5]; // index 0 unused - there is no Level 0 here
      // What one registration is modeled as "selling" for, in the Company Report's revenue figure.
      const BASIC_ACCOUNT_PRICE = 5000;
      // Royalty's five rank names, index = rankLvl()'s 0-4 output.
      const RN = ["Member", "Leader", "Supervisor", "Manager", "Director"];
      const nf = (n) => n.toLocaleString("en-US"), // number with thousands separators
        peso = (n) => "₱" + nf(n); // ...with a peso sign in front
      // localStorage key. All of this page's state lives under this one key, as one JSON blob.
      const KEY = "royalty_harvests_v1";
      // Module-level, NOT part of S, so none of these survive a reset() or a page reload:
      //   mem    - in-memory fallback copy of S's JSON, used if localStorage itself is unavailable
      //            (private browsing, storage disabled, quota exceeded) so the page still works for
      //            the rest of this tab's life, just without persistence across reloads (see warn).
      //   warn   - true once any localStorage call has failed; dash()/authView() show a small notice.
      //   armed  - the Reset button's "click again to confirm" state.
      //   lastIndirect - the most recent payIndirectReferral() result ({total, dist}), stashed here so
      //            whichever caller just registered someone (doReg/under/doBulk) can report on it in
      //            their own toast without reg()/bulkAdd() needing to change what they return.
      let mem = "",
        warn = false,
        armed = false,
        lastIndirect = null;
      // The complete shape of this app's state, S. Everything the simulator knows lives in one of
      // these fields; nothing is tracked outside S except the four module-level variables just above.
      //   users               - every registered member, in registration order: {id, name, sp}. id is
      //                         always equal to its own array index (ids are never reused or gapped),
      //                         which every O(N) pass in this file relies on. sp is the sponsor's id,
      //                         always smaller than this member's own id. id 0 is "company", the root.
      //   mx                  - the Harvest qualification queue: ids, in the order each one sponsored
      //                         their 3rd direct. Position in this array drives General Harvest (queue
      //                         index = matrix position) and gates Team Harvest (only queue members
      //                         count, and only a downline that queued later than you is "your team").
      //   me                  - the id of whoever is currently logged in, or null if nobody is.
      //   on                  - {g,t,r,u,i}: which of the five bonus streams (General/Team/Royalty/
      //                         Unilevel/Indirect) the UI currently folds into "Total ₱" and the
      //                         members-table ranking. Purely a display preference - never affects the
      //                         Company Report, which always counts every peso actually paid.
      //   month               - the current month number, starting at 1, incremented only by
      //                         evaluateMonth() (i.e. only by "Advance month").
      //   sales               - {id: pesos}, THIS MONTH's personal purchases only. Reset to {} by
      //                         evaluateMonth(); this is the figure both Royalty's quota check and
      //                         Unilevel's next-month Active/Inactive decision read.
      //   purchasedAll        - {id: pesos}, ALL-TIME personal purchases, never reset. Feeds the
      //                         Company Report's repeat-purchase revenue line.
      //   earnedAll           - {id: pesos}, Royalty earned all-time.
      //   lastMonthTotal/Count - Royalty's total paid, and how many members earned it, in the month
      //                         that most recently ended (snapshotted by evaluateMonth() right before
      //                         the reset below it).
      //   unilevelEarned      - {id: pesos}, Unilevel earned all-time (across every real-time payout).
      //   unilevelFlag        - {id: true|false}, each member's Active (true) / Inactive (false)
      //                         status for the CURRENT month, wholesale-replaced every evaluateMonth()
      //                         call. A member with no entry at all here (never yet evaluated) is
      //                         Active by default - see the eligibility check inside recordPurchase().
      //   unilevelLastSales   - {id: pesos}, a snapshot of each member's S.sales at the moment of the
      //                         most recent evaluateMonth(), kept only so the UI can show "you bought
      //                         ₱X last month" without having to recompute it from history.
      //   unilevelMonthTotal  - running total of Unilevel paid out since the last evaluateMonth(),
      //                         across every recordPurchase() call (manual or Auto-purchase). Snapshotted
      //                         into lastMonthUnilevelTotal and reset to 0 each time the month turns over.
      //   lastMonthUnilevelTotal - Unilevel's total for the month that most recently ended.
      //   lastAutoPurchaseLog - the detailed per-purchase breakdown from the MOST RECENT Auto-purchase
      //                         click only (who bought, how much, who it paid and at what level) -
      //                         wholesale-replaced every click, never accumulated across clicks or months.
      //                         Lets the logged-in member see exactly where their Unilevel money from
      //                         that one pass came from (see the apl panel inside dash()).
      //   indirectEarned      - {id: pesos}, Indirect Referral earned all-time.
      const fresh = () => ({
        users: [{ id: 0, name: "company", sp: null }],
        mx: [],
        me: null,
        on: { g: 1, t: 1, r: 1, u: 1 },
        month: 1,
        sales: {},
        purchasedAll: {},
        earnedAll: {},
        lastMonthTotal: 0,
        lastMonthCount: 0,
        unilevelEarned: {},
        unilevelFlag: {},
        unilevelLastSales: {},
        unilevelMonthTotal: 0,
        lastMonthUnilevelTotal: 0,
        lastAutoPurchaseLog: [],
        indirectEarned: {},
      });
      // Load saved state, falling back to the in-memory copy (see mem, above) and then to a brand new
      // fresh() network if neither exists yet (first-ever visit, or storage unavailable from the start).
      function load() {
        try {
          const s = localStorage.getItem(KEY);
          if (s) return JSON.parse(s);
        } catch (e) {
          warn = true;
        }
        return mem ? JSON.parse(mem) : fresh();
      }
      let S = load();
      // Backward-compatible defaults for state saved by an earlier version of this page, before a
      // field existed yet: S.on||{...} only helps a BRAND NEW S (nothing saved at all), since an
      // EXISTING S.on object already exists and skips the ||; each new stream needs its own explicit
      // ===undefined check so old sessions pick up the new default instead of silently reading as 0/off.
      S.on = S.on || { g: 1, t: 1, r: 1, u: 1, i: 1 };
      if (S.on.u === undefined) S.on.u = 1;
      if (S.on.i === undefined) S.on.i = 1;
      S.unilevelEarned = S.unilevelEarned || {};
      S.unilevelLastSales = S.unilevelLastSales || {};
      // Migrate the old gate naming (missing meant closed) to the new flag (missing means Active). Existing
      // explicit true/false decisions carry over unchanged; only never-yet-evaluated members change meaning.
      S.unilevelFlag = S.unilevelFlag || S.unilevelGate || {};
      delete S.unilevelGate;
      S.unilevelMonthTotal = S.unilevelMonthTotal || 0;
      S.lastMonthUnilevelTotal = S.lastMonthUnilevelTotal || 0;
      S.indirectEarned = S.indirectEarned || {};
      S.lastAutoPurchaseLog = S.lastAutoPurchaseLog || [];
      // Persist S as one JSON blob, every time anything changes it. mem (see above) always gets the
      // latest copy even if localStorage itself fails, so the running page keeps working regardless.
      function save() {
        mem = JSON.stringify(S);
        try {
          localStorage.setItem(KEY, mem);
        } catch (e) {
          warn = true;
        }
      }
      const U = (id) => S.users[id]; // look up a member by id - works because id === its array index
      const byName = (n) =>
        S.users.find(
          (u) => u.name.toLowerCase() === String(n).trim().toLowerCase(),
        );
      // directs(): how many people THIS member personally sponsored, regardless of Harvest/Royalty
      // status. O(N) per call (a full scan), fine for the one-off single-registration path that calls
      // it; bulkAdd() keeps its own running liveDirects count instead so a whole batch stays fast.
      const directs = (id) => S.users.filter((u) => u.sp === id).length;
      // pos(): this member's position in the Harvest queue (S.mx), or -1 if they have not qualified.
      const pos = (id) => S.mx.indexOf(id);

      // Pays a flat, unconditional bonus to each of a new member's sponsors, up to 10 levels up, the instant
      // registration succeeds - no quota, no rank, no monthly cycle, unlike Unilevel or Royalty. Stashes its
      // own result in lastIndirect so whichever caller just registered someone can report on it immediately.
      function payIndirectReferral(newId) {
        let cur = U(newId).sp,
          total = 0;
        const dist = [];
        for (let L = 1; L <= 10 && cur !== null; L++) {
          if (cur > 0) {
            const amt = INDIRECT_BONUS[L];
            S.indirectEarned[cur] = (S.indirectEarned[cur] || 0) + amt;
            total += amt;
            dist.push({ id: cur, level: L, amount: amt });
          }
          cur = U(cur).sp;
        }
        lastIndirect = { total, dist };
        return lastIndirect;
      }
      // Register a free member. If the sponsor now has 3 directs, they join the Harvest queue. Royalty rank
      // is never tracked here - it is derived fresh from the tree whenever ranks() is called. Indirect
      // Referral always runs, as an unconditional side effect of registering - see payIndirectReferral().
      function reg(name, spName) {
        name = name.trim();
        if (!/^[a-z0-9_]{2,20}$/i.test(name))
          return "Username must be 2 to 20 letters, numbers or underscores.";
        if (byName(name)) return "That username is already taken.";
        const sp = byName(spName || "company");
        if (!sp)
          return 'Sponsor not found. Use an existing username, or "company".';
        S.users.push({ id: S.users.length, name, sp: sp.id });
        if (sp.id && pos(sp.id) < 0 && directs(sp.id) >= 3) S.mx.push(sp.id);
        const u = S.users[S.users.length - 1];
        payIndirectReferral(u.id);
        return u;
      }

      // ---- HARVEST: GENERAL + TEAM MATRIX MATHS ----
      // Both matrices share the same shape (3 directs per slot, 10 levels, level L holding T(L)=3^L
      // slots) and the same "levels array" result shape: ten {L, t, f, paid, b} objects, one per level
      // (t = total slots, f = how many are filled, paid = f>=t, b = that level's bonus amount). Every
      // function below from earn() through progT() is generic over that shape, so the exact same code
      // pays out General and Team Harvest - only WHO counts as "filled" differs between the two.
      //
      // General matrix: position p = this member's index in the Harvest queue (S.mx), apex = p 0, and
      // slots fill breadth-first in queue order - level L's T(L) slots are exactly the T(L) queue
      // positions starting right after level L-1's. Team matrix: n = how many of THIS member's
      // downline queued for Harvest after they did (see counts()); the matrix fills the same way, just
      // counting a personal population instead of a shared queue position.
      function levelsG(p) {
        const N = S.mx.length;
        return Array.from({ length: 10 }, (_, i) => {
          const L = i + 1,
            t = T(L),
            s = t * p + (t - 1) / 2,
            f = Math.max(0, Math.min(t, N - s));
          return { L, t, f, paid: f >= t, b: BONUS_G[L] };
        });
      }
      const levelsT = (n) =>
        Array.from({ length: 10 }, (_, i) => {
          const L = i + 1,
            t = T(L),
            f = Math.max(0, Math.min(t, n - (t - 3) / 2));
          return { L, t, f, paid: f >= t, b: BONUS_T[L] };
        });
      // earn(): total bonus paid so far across a levels array (every level that's already full).
      // prg(): a one-line progress string for the first level that ISN'T full yet.
      const earn = (a) => a.reduce((s, l) => s + (l.paid ? l.b : 0), 0),
        prg = (a) => {
          const l = a.find((x) => !x.paid);
          return l
            ? `Level ${l.L}: ${nf(l.f)}/${nf(l.t)}`
            : "All 10 levels complete";
        };
      const earnedG = (p) => earn(levelsG(p)),
        progG = (p) => prg(levelsG(p)),
        earnedT = (n) => earn(levelsT(n)),
        progT = (n) => prg(levelsT(n));
      // Renders one levels array as the ten-row table used for both the General and Team matrix panels.
      const lvT = (L) =>
        `<div class="sc"><table><tr><th>Level</th><th>Slots</th><th>Filled</th><th>Bonus</th><th>Status</th></tr>${L.map((l) => `<tr><td>${l.L}</td><td>${nf(l.t)}</td><td>${nf(l.f)}</td><td>${peso(l.b)}</td><td>${l.paid ? '<span class="ok">Paid</span>' : `<div class="bar" title="${nf(l.f)} of ${nf(l.t)}"><i style="width:${(l.f / l.t) * 100}%"></i></div>`}</td></tr>`).join("")}</table></div>`;
      // dep(n): the deepest Team Harvest level a team of size n has filled - used for the "fastest
      // team" style stats, given any individual member's team size.
      const dep = (n) => {
        let L = 0;
        while ((T(L + 1) - 1) / 2 <= n) L++;
        return L;
      };
      // parentName(q): the name of whoever sits directly above General-matrix position q (its parent
      // slot), found by the matrix's fixed 3-children-per-slot formula - purely positional, unrelated
      // to the sponsor tree itself.
      const parentName = (q) => U(S.mx[Math.floor((q - 1) / 3)]).name;
      // depth(): the deepest General Harvest level the WHOLE network's queue has filled so far - the
      // network-wide equivalent of dep(), read straight from S.mx.length instead of a team size.
      function depth() {
        const i = S.mx.length - 1;
        if (i < 0) return "None yet";
        let L = 0;
        while ((T(L + 1) - 1) / 2 <= i) L++;
        return L ? "Level " + L : "Apex only";
      }
      // lvOf(r): which Team Harvest level a teammate at 0-based rank r (r-th to have qualified, among
      // a team) lands on - the inverse of the slot-count formula T(L).
      const lvOf = (r) => {
        let L = 1;
        while (r >= (T(L + 1) - 3) / 2) L++;
        return L;
      };
      // pd(): how many levels in a levels array are already paid (fully filled) - used by snap() to
      // build a before/after picture for toasts, without needing the bonus amounts, just the count.
      const pd = (a) => a.filter((l) => l.paid).length;
      // isUp(a, u): is member a an ancestor of member u, anywhere up u's sponsor chain? The basic
      // "is this person in my downline" test that team(), the general-matrix Direct/Indirect/Outside
      // labels, and the Royalty team-scoping logic are all built from.
      const isUp = (a, u) => {
        let x = U(u).sp;
        while (x !== null && x !== a) x = U(x).sp;
        return x === a;
      };
      // Teammate counts: for each ancestor, downline who joined the Harvest queue after them (company counts everyone).
      function counts() {
        const Q = new Map(S.mx.map((u, i) => [u, i])),
          n = {};
        S.mx.forEach((u, i) => {
          for (let a = U(u).sp; a !== null; a = U(a).sp) {
            const q = a === 0 ? -1 : Q.has(a) ? Q.get(a) : Infinity;
            if (q < i) n[a] = (n[a] || 0) + 1;
          }
        });
        return n;
      }
      // team(id): id's Team Harvest team - their downline who joined the Harvest queue AFTER id did,
      // in queue order. (Contrast with Royalty's teamOf(), below, which is id's ENTIRE downline,
      // unconditional on Harvest queue order at all - two genuinely different "team" definitions that
      // happen to share a name in everyday use, each serving its own bonus system.)
      function team(id) {
        const o = [];
        for (let i = pos(id) + 1; i < S.mx.length; i++)
          if (isUp(id, S.mx[i])) o.push(S.mx[i]);
        return o;
      }
      // snap(): a before-picture of every Harvest-qualified member's completed-level counts (General
      // and Team both), for toasts to diff against after a registration - see qmsg(), further down,
      // which turns two snap() calls into "you completed Level 2, 3 other members completed a level".
      const snap = () => {
        const n = counts(),
          g = {},
          t = {};
        S.mx.forEach((u, i) => {
          g[u] = pd(levelsG(i));
          t[u] = pd(levelsT(n[u] || 0));
        });
        return { q: S.mx.length, g, t };
      };

      // ---- ROYALTY: RANK LADDER + MONTHLY PAYOUT MATHS ----
      // Subtree rollup: out[id] = fn(id) + fn summed over id's entire downline. out[0] totals the whole network.
      // Valid because every sponsor already has a smaller id than its sponsee (ids are assigned in join order).
      // This single O(N) pass is what makes ranks(), groupSalesAll() and teamOf()'s callers all cheap
      // even at tens of thousands of members - Royalty's "team" is the whole downline, with no cap and
      // no queue-order filter the way Harvest's team() has, so a naive per-member tree walk would be
      // far slower at scale.
      function rollup(fn) {
        const N = S.users.length - 1,
          out = {};
        for (let i = N; i >= 1; i--) {
          out[i] = (out[i] || 0) + fn(i);
          const p = S.users[i].sp;
          if (p !== null) out[p] = (out[p] || 0) + out[i];
        }
        return out;
      }
      // directCounts(): every member's direct-sponsee count, all at once, as one dict - the O(N)-total
      // equivalent of calling directs() (above) once per member, which would cost O(N^2). Used
      // wherever a full-network pass needs everyone's count at once (ranks(), dash()'s stats).
      function directCounts() {
        const d = {};
        for (let i = 1; i < S.users.length; i++) {
          const p = S.users[i].sp;
          if (p !== null) d[p] = (d[p] || 0) + 1;
        }
        return d;
      }
      // Royalty ranks are self-prerequisite and therefore automatically cumulative: a team member who has gone
      // on to Director still satisfies "10 Leaders", because Director required Manager, which required
      // Supervisor, which required Leader. Entirely independent of Harvest's own 3-direct qualification.
      function ranks() {
        const N = S.users.length - 1,
          d = directCounts();
        const isL = {};
        for (let i = 1; i <= N; i++) isL[i] = (d[i] || 0) >= 10;
        const r1 = rollup((i) => (isL[i] ? 1 : 0));
        const isS = {};
        for (let i = 1; i <= N; i++)
          isS[i] = isL[i] && r1[i] - (isL[i] ? 1 : 0) >= 10;
        const r2 = rollup((i) => (isS[i] ? 1 : 0));
        const isM = {};
        for (let i = 1; i <= N; i++)
          isM[i] = isS[i] && r2[i] - (isS[i] ? 1 : 0) >= 10;
        const r3 = rollup((i) => (isM[i] ? 1 : 0));
        const isD = {};
        for (let i = 1; i <= N; i++)
          isD[i] = isM[i] && r3[i] - (isM[i] ? 1 : 0) >= 10;
        const ts = rollup(() => 1);
        return { d, isL, isS, isM, isD, r1, r2, r3, ts };
      }
      // rankName()/rankLvl(): turn a ranks() result into this member's single highest rank, as a
      // display string or as a 0 (Member) to 4 (Director) number for sorting/comparison.
      const rankName = (R, i) =>
        R.isD[i]
          ? "Director"
          : R.isM[i]
            ? "Manager"
            : R.isS[i]
              ? "Supervisor"
              : R.isL[i]
                ? "Leader"
                : "Member";
      const rankLvl = (R, i) =>
        R.isD[i] ? 4 : R.isM[i] ? 3 : R.isS[i] ? 2 : R.isL[i] ? 1 : 0;
      // Every member's "Group Sales": their own S.sales this month, plus their entire downline's -
      // exactly what each paid rank's monthly quota (RANK_QUOTA) is checked against.
      const groupSalesAll = () => rollup((i) => S.sales[i] || 0);
      // teamOf(id): id's ENTIRE downline, any depth, unconditional on Harvest queue order or anything
      // else - this is Royalty's own notion of "team" (see the comment on team(), above, for how it
      // differs from Team Harvest's). Used for the rank ladder's "10 team members who are X+" checks
      // and for the "Your Royalty team" table in dash().
      function teamOf(id) {
        const kids = {};
        for (let i = 1; i < S.users.length; i++) {
          const p = S.users[i].sp;
          if (p !== null) (kids[p] = kids[p] || []).push(i);
        }
        const out = [],
          stack = [id];
        while (stack.length) {
          const x = stack.pop();
          (kids[x] || []).forEach((c) => {
            out.push(c);
            stack.push(c);
          });
        }
        return out;
      }
      // Reference data + a renderer for the Rank ladder panel: RANK_ROWS is the plain-English
      // requirement text; ladderT() fills in each paid rank's live quota/percentages from the
      // RANK_QUOTA/GROUP_PCT/PERSONAL_PCT constants, so the two never drift apart.
      const RANK_ROWS = [
        { r: "Member", req: "Automatic on registration" },
        { r: "Leader", req: "10 direct sponsees (not royalty-eligible)" },
        { r: "Supervisor", req: "10 team members who are Leader+" },
        { r: "Manager", req: "10 team members who are Supervisor+" },
        { r: "Director", req: "10 team members who are Manager+" },
      ];
      const ladderT = () =>
        `<div class="sc"><table><caption class="sr">Royalty rank ladder</caption><tr><th>Rank</th><th>Requirement</th><th>Monthly quota</th><th>Group %</th><th>Personal %</th></tr>${RANK_ROWS.map((x) => `<tr><td>${x.r}</td><td>${x.req}</td><td>${RANK_QUOTA[x.r] ? peso(RANK_QUOTA[x.r]) : "—"}</td><td>${GROUP_PCT[x.r] ? Math.round(GROUP_PCT[x.r] * 100) + "%" : "—"}</td><td>${PERSONAL_PCT[x.r] ? Math.round(PERSONAL_PCT[x.r] * 100) + "%" : "—"}</td></tr>`).join("")}</table></div>`;
      // Same idea as ladderT() above, one reference table each for Unilevel's and Indirect Referral's
      // own schedules, both generated straight from their constants so the displayed numbers can never
      // drift from the numbers actually paid.
      const unilevelT = () =>
        `<div class="sc"><table><caption class="sr">Unilevel Repeat-Purchase Bonus schedule</caption><tr><th>Level</th><th>Who</th><th>Rate</th></tr>${UNILEVEL_PCT.map((pct, L) => `<tr><td>${L}</td><td>${L === 0 ? "The buyer (self)" : "Upline, " + L + " level" + (L > 1 ? "s" : "") + " up"}</td><td>${Math.round(pct * 100)}%</td></tr>`).join("")}</table></div>`;
      const indirectT = () =>
        `<div class="sc"><table><caption class="sr">Indirect Referral Bonus schedule</caption><tr><th>Level</th><th>Who</th><th>Bonus</th></tr>${INDIRECT_BONUS.slice(
          1,
        )
          .map(
            (amt, i) =>
              `<tr><td>${i + 1}</td><td>Upline, ${i + 1} level${i + 1 > 1 ? "s" : ""} up</td><td>${peso(amt)}</td></tr>`,
          )
          .join("")}</table></div>`;

      // The Royalty payout formula for one member this month: not eligible at all if they're not a
      // paid rank (rankNm isn't in RANK_QUOTA); otherwise pays rank% of Group Sales + rank% of Personal
      // Sales, but ONLY if Group Sales actually cleared that rank's quota - falling short pays nothing,
      // it doesn't scale down proportionally.
      function payout(rankNm, gs, ps) {
        const q = RANK_QUOTA[rankNm];
        if (q === undefined)
          return { elig: false, hit: false, quota: 0, pay: 0 };
        const hit = gs >= q;
        return {
          elig: true,
          hit,
          quota: q,
          pay: hit
            ? Math.round(GROUP_PCT[rankNm] * gs + PERSONAL_PCT[rankNm] * ps)
            : 0,
        };
      }
      // Unilevel pays in real time, on every purchase: Level 0 always goes to the buyer; levels 1-10 walk the
      // sponsor chain and pay each upline unless THEIR flag (set by last month's evaluateMonth) is explicitly
      // Inactive. A member with no entry yet - never evaluated, brand new, or still in month 1 - reads as
      // Active by default, which is what lets month 1 (and any new member) earn from their downline immediately.
      function recordPurchase(id, amt) {
        amt = Math.max(0, Math.round(+amt || 0));
        if (amt <= 0) return null;
        S.sales[id] = (S.sales[id] || 0) + amt;
        S.purchasedAll[id] = (S.purchasedAll[id] || 0) + amt;
        const l0 = Math.round(UNILEVEL_PCT[0] * amt);
        S.unilevelEarned[id] = (S.unilevelEarned[id] || 0) + l0;
        S.unilevelMonthTotal = (S.unilevelMonthTotal || 0) + l0;
        let cur = U(id).sp,
          upTotal = 0,
          paidCount = 0,
          skippedCount = 0;
        const dist = [];
        for (let L = 1; L <= 10 && cur !== null; L++) {
          if (cur > 0) {
            if (S.unilevelFlag[cur] !== false) {
              const pay = Math.round(UNILEVEL_PCT[L] * amt);
              S.unilevelEarned[cur] = (S.unilevelEarned[cur] || 0) + pay;
              S.unilevelMonthTotal = (S.unilevelMonthTotal || 0) + pay;
              upTotal += pay;
              paidCount++;
              dist.push({ id: cur, level: L, amount: pay });
            } else skippedCount++;
          }
          cur = U(cur).sp;
        }
        return { amt, l0, upTotal, paidCount, skippedCount, dist };
      }
      // Simulates purchase activity for ~PUR_RATE of the network. Each purchase still runs through
      // recordPurchase(), so Unilevel still pays in real time, exactly as a manual purchase would - this
      // is a standalone action now, separate from evaluateMonth()/Advance Month, which only judges eligibility.
      function autoPurchasePass() {
        const N = S.users.length - 1;
        let buyers = 0,
          total = 0,
          unilevel = 0;
        const log = [];
        for (let i = 1; i <= N; i++)
          if (Math.random() < PUR_RATE) {
            const amt =
              PUR_MIN +
              Math.floor(Math.random() * ((PUR_MAX - PUR_MIN) / 100 + 1)) * 100;
            const r = recordPurchase(i, amt);
            if (r) {
              buyers++;
              total += r.amt;
              unilevel += r.l0 + r.upTotal;
              log.push({ buyer: i, amt: r.amt, l0: r.l0, dist: r.dist });
            }
          }
        S.lastAutoPurchaseLog = log;
        return { buyers, total, unilevel };
      }
      // Evaluate every member's Group Sales against their rank's quota, pay Supervisor+, then reset the month.
      // Independent of Harvest: registering members never triggers this, only "Advance month" does.
      function evaluateMonth() {
        const R = ranks(),
          gs = groupSalesAll(),
          N = S.users.length - 1;
        let total = 0,
          count = 0;
        for (let i = 1; i <= N; i++) {
          const { pay } = payout(rankName(R, i), gs[i] || 0, S.sales[i] || 0);
          if (pay > 0) {
            S.earnedAll[i] = (S.earnedAll[i] || 0) + pay;
            total += pay;
            count++;
          }
        }
        // Unilevel's status for the WHOLE next month is fixed here, from this month's personal sales alone -
        // always an explicit true/false for every member, replacing whatever they had before. A member who has
        // never been through this check at all (brand new, or month 1) has no entry here yet, and the
        // eligibility check in recordPurchase() treats that absence as Active, not Inactive.
        const newFlag = {},
          lastSales = {};
        let activeNext = 0;
        for (let i = 1; i <= N; i++) {
          const s = S.sales[i] || 0;
          lastSales[i] = s;
          newFlag[i] = s >= UNILEVEL_QUOTA;
          if (newFlag[i]) activeNext++;
        }
        S.unilevelFlag = newFlag;
        S.unilevelLastSales = lastSales;
        const unilevelTotal = S.unilevelMonthTotal || 0;
        S.lastMonthUnilevelTotal = unilevelTotal;
        S.unilevelMonthTotal = 0;
        S.sales = {};
        S.month = (S.month || 1) + 1;
        S.lastMonthTotal = total;
        S.lastMonthCount = count;
        return { total, count, unilevelTotal, activeNext };
      }

      // ---- SPONSOR-PATTERN BULK REGISTRATION ----
      // sponsorPlan(): works out, upfront, who the sponsor of each of K NEW members will be, without
      // registering anyone yet - a "plan" rather than an action, so bulkAdd() (below) can execute it as
      // one fast pass. root=null means anywhere in the network; otherwise everything stays confined to
      // root's own existing team (plus root itself). Three patterns, each a different growth shape:
      //   random   - each new member's sponsor is picked at random from everyone in scope, including
      //              new members already placed earlier in this SAME batch - the ordinary, realistic
      //              shape, roughly as wide as it is deep.
      //   balanced - fills whichever in-scope member currently has the fewest directs first, capped at
      //              10 directs per member, producing the minimum-size tree needed to reach a given
      //              Harvest/Royalty rank: 11 members for the first Leader, 111 for the first
      //              Supervisor, 1111 for Manager, 11111 for Director.
      //   chain    - each new member's sponsor is simply the previous new member (or whoever already
      //              has the highest id in scope), producing one long, 1-wide line - good for testing
      //              deep-but-narrow structures, but since nobody in a pure chain ever reaches 3 or 10
      //              directs, nobody in it ever qualifies for Harvest or Royalty.
      // Pure tree structure either way - independent of Harvest qualification or Royalty rank, it only
      // decides who sponsors whom; placeholder objects like {ph:k} stand in for "the k-th new member in
      // this batch", resolved to a real id once bulkAdd() actually creates them in order.
      function sponsorPlan(pattern, root, K) {
        const real =
          root === null
            ? S.users.filter((u) => u.id !== 0).map((u) => u.id)
            : [root, ...teamOf(root)];
        if (pattern === "chain") {
          let cur = real.reduce((a, b) => Math.max(a, b), 0);
          const out = [];
          for (let k = 0; k < K; k++) {
            out.push(cur);
            cur = { ph: k };
          }
          return out;
        }
        if (pattern === "balanced") {
          const d = directCounts(),
            rem = new Map(),
            queue = [];
          if (root === null && real.length === 0) {
            rem.set(0, 1);
            queue.push(0);
          }
          real.forEach((id) => {
            const r = 10 - (d[id] || 0);
            if (r > 0) {
              rem.set(id, r);
              queue.push(id);
            }
          });
          if (!queue.length) {
            rem.set(root, 10);
            queue.push(root);
          }
          let head = 0;
          const out = [];
          for (let k = 0; k < K; k++) {
            while (rem.get(queue[head]) <= 0) head++;
            const sp = queue[head];
            out.push(sp);
            rem.set(sp, rem.get(sp) - 1);
            const ph = { ph: k };
            rem.set(ph, 10);
            queue.push(ph);
            if (rem.get(sp) <= 0) head++;
          }
          return out;
        }
        const pool = real.length ? real.slice() : [0];
        const out = [];
        for (let k = 0; k < K; k++) {
          out.push(pool[Math.floor(Math.random() * pool.length)]);
          pool.push({ ph: k });
        }
        return out;
      }
      // Fast bulk registration path: name assumed pre-validated and unique, sponsor given by id. Harvest's
      // 3-direct qualification is tracked incrementally (liveDirects/mxIdx) rather than rescanning the whole
      // network per registration, so a whole bulk batch stays O(K) even though it can push onto S.mx many
      // times over. Royalty rank needs no equivalent bookkeeping here, since ranks() derives it fresh on demand.
      function bulkAdd(pattern, root, K) {
        const plan = sponsorPlan(pattern, root, K);
        const newIds = new Array(K).fill(undefined);
        const liveDirects = directCounts();
        const mxIdx = new Map(S.mx.map((id, i) => [id, i]));
        let added = 0,
          indirectTotal = 0;
        for (let k = 0; k < K; k++) {
          let sp = plan[k];
          if (sp && typeof sp === "object") sp = newIds[sp.ph];
          if (sp === undefined) continue;
          const u = { id: S.users.length, name: "m" + S.users.length, sp };
          S.users.push(u);
          liveDirects[sp] = (liveDirects[sp] || 0) + 1;
          if (sp > 0 && liveDirects[sp] === 3 && !mxIdx.has(sp)) {
            mxIdx.set(sp, S.mx.length);
            S.mx.push(sp);
          }
          indirectTotal += payIndirectReferral(u.id).total;
          newIds[k] = u.id;
          added++;
        }
        return { added, indirectTotal };
      }

      // rankSnap(): a before-picture of every member's current rank level (0-4), for rankMsg() (below)
      // to diff against after a registration - the Royalty equivalent of snap(), further up.
      function rankSnap() {
        const R = ranks(),
          N = S.users.length - 1,
          s = {};
        for (let i = 1; i <= N; i++) s[i] = rankLvl(R, i);
        return s;
      }
      // Extra sentence for toasts: who newly reached which Royalty rank since snapshot b (id gets its own mention).
      function rankMsg(before, id) {
        const R = ranks(),
          N = S.users.length - 1;

        for (let i = 1; i <= N; i++) {

      }
      // Extra sentence for toasts: who qualified for Harvest and which levels completed (either matrix) since snapshot b.
      function qmsg(b, id) {

        for (const u in a.g)

            ["g", BONUS_G, "General"],

          ]) {
            const o = b[k][u] || 0,
              d = a[k][u] - o;

          (me
            ? ` You qualified for Harvest at position <b>#${pos(id) + 1}</b>.`
            : "") +

            ? ` ${oq} ${me ? "other " : ""}member${oq > 1 ? "s" : ""} qualified.`
            : "") +

      // ---- SHARED UI: TOASTS, FOCUS-PRESERVING RE-RENDER, PAGINATION ----
      // Nothing below this point is specific to any one bonus system - these are the small utilities
      // dash()/authView() and the event handlers lean on to render and to stay usable across the
      // frequent full re-renders this page does after every single state change.
      //
      // Toasts live outside #root so they survive re-renders; the region is announced politely.
      function toast(msg) {
        const box = document.getElementById("toasts"),
          el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `<span class="ti" aria-hidden="true">✓</span><span>${msg}</span><button type="button" aria-label="Dismiss notification">×</button>`;
        let t, r;
        const stop = () => {
            clearTimeout(t);
            clearTimeout(r);
            el.classList.remove("out");
          },
          close = () => {
            stop();
            el.remove();
          },
          fade = () => {
            el.classList.add("out");
            r = setTimeout(() => el.remove(), 500);
          },
          arm = () => {
            stop();
            t = setTimeout(fade, 5000);
          };
        el.querySelector("button").onclick = close;
        el.onmouseenter = stop;
        el.onmouseleave = arm;
        el.addEventListener("focusin", stop);
        el.addEventListener("focusout", arm);
        box.appendChild(el);
        while (box.children.length > 3) box.firstChild.remove();
        arm();
      }
      // Full re-renders keep keyboard focus and typed text - inputs and selects alike.
      function keep(fn) {
        const a = document.activeElement,
          k = a && a.dataset && a.dataset.f,
          v = {};
        document
          .querySelectorAll("input[data-f],select[data-f]")
          .forEach((i) => (v[i.dataset.f] = i.value));
        fn();
        for (const x in v) {
          const i = document.querySelector('[data-f="' + x + '"]');
          if (i) i.value = v[x];
        }
        if (k) {
          const e = document.querySelector('[data-f="' + k + '"]');
          if (e) e.focus();
        }
      }
      // Pagination: state per table, page sizes start at 10. 'team' is Team Harvest's downline (qualified
      // after you); 'rteam' is Royalty's downline (unconditional, entire subtree) - genuinely different sets.
      const PG = {},
        PL = {
          gen: "Your general matrix",
          team: "Your team",
          rteam: "Your Royalty team",
          apl: "Auto-purchase breakdown",
          members: "Members",
        };
      const pgs = (k) => PG[k] || (PG[k] = { p: 1, s: 10 });
      function page(k, arr) {
        const st = pgs(k),
          n = Math.max(1, Math.ceil(arr.length / st.s));
        st.p = Math.min(Math.max(1, st.p), n);
        return arr.slice((st.p - 1) * st.s, st.p * st.s);
      }
      function goPg(k, to) {
        const st = pgs(k);
        if (to === st.p) return;
        st.p = to;
        render();
      }
      function setSize(k, v) {
        const st = pgs(k);
        st.p = Math.floor(((st.p - 1) * st.s) / v) + 1;
        st.s = v;
        render();
      }
      const pageList = (p, n) => {
        if (n <= 7) return Array.from({ length: n }, (_, i) => i + 1);
        const a = [...new Set([1, 2, p - 1, p, p + 1, n - 1, n])]
            .filter((x) => x >= 1 && x <= n)
            .sort((x, y) => x - y),
          o = [];
        a.forEach((x, i) => {
          if (i && x - a[i - 1] > 1) o.push("…");
          o.push(x);
        });
        return o;
      };
      function pager(k, n) {
        const st = pgs(k),
          pages = Math.max(1, Math.ceil(n / st.s)),
          p = st.p,
          a = n ? (p - 1) * st.s + 1 : 0,
          b = Math.min(n, p * st.s);
        const sum = `<span class="mut">Showing ${nf(a)}–${nf(b)} of ${nf(n)}</span>`;
        if (n <= 10) return `<div class="pgr">${sum}</div>`;
        const B = (key, lbl, to, txt, off, cur) =>

        const nums = pageList(p, pages)
          .map((x) =>
            x === "…"

                  "n" + x,
                  x === p ? `Page ${x}, current page` : `Go to page ${x}`,

        return `<nav class="pgr" aria-label="${PL[k]} pagination"><label class="rpp">Rows per page<select data-f="${k}-size" onchange="setSize('${k}',+this.value)">${[10, 25, 50, 100].map((v) => `<option${v === st.s ? " selected" : ""}>${v}</option>`).join("")}</select></label>${sum}<div class="pbs">${B("first", "First page", 1, "«", p === 1)}${B("prev", "Previous page", Math.max(1, p - 1), "‹", p === 1)}${nums}${B("next", "Next page", Math.min(pages, p + 1), "›", p === pages)}${B("last", "Last page", pages, "»", p === pages)}</div></nav>`;

      // ---- RENDERING: dash() (logged in) and authView() (logged out) ----

        let activeNow = 0;

<div class="bar" title="${peso(myGS)} of ${peso(q)}"><i style="width:${Math.min(100, (myGS / q) * 100)}%"></i></div>

        const myG = p < 0 ? 0 : earnedG(p),

<p class="mut">Indirect Referral earned all-time: <b>${peso(myI)}</b>.</p>`;

}</table></div>${pager("gen", gm.length)}</div>`;

${

        // Auto-purchase's log is replaced wholesale every click, never accumulated, and filtered here to

${

  .map(
    (x) =>
      `<tr><td>${x.name}</td><td>${x.level === 0 ? "0 (you)" : x.level}</td><td>${peso(x.amt)}</td><td>${peso(x.earned)}</td></tr>`,
  )
  .join("")}</table></div>${pager("apl", myAutoLog.length)}`
    : `<p class="mut">${aplSummary ? "Nobody in that pass earned you anything - either none of them were in your line, or you weren't Active at the time." : "No Auto-purchase pass has run yet."}</p>`
}</div>`;
        const cb = (k, f, l) =>
          `<label style="display:inline-flex;align-items:center;margin-right:16px"><input type="checkbox" data-f="${f}" style="width:auto;margin-right:6px"${on[k] ? " checked" : ""} onchange="S.on.${k}=this.checked?1:0;save();render()">${l}</label>`;

        return `<div class="top"><div><h1>Harvest Simulator: General + Team + Royalty</h1><span class="mut">Admin view, logged in as <b>${me.name}</b>. Simulation only.</span></div>
<div class="row"><button class="sec" onclick="S.me=null;save();render()">Log out</button><button class="sec" onclick="reset()">Reset</button></div></div>
${m ? `<p class="err">${m}</p>` : ""}${warn ? '<p class="mut">Browser storage is unavailable here, so data resets when this tab closes.</p>' : ""}
<div class="stats"><div><b>${N}</b>members registered</div><div><b>${NQ}</b>Harvest-qualified</div><div><b>${tierCounts[1]}</b>Leaders</div><div><b>${tierCounts[2]}</b>Supervisors</div><div><b>${tierCounts[3]}</b>Managers</div><div><b>${tierCounts[4]}</b>Directors</div><div><b>${peso(tg)}</b>General credited</div><div><b>${peso(tt)}</b>Team credited</div><div><b>${peso(tr)}</b>Royalty credited</div><div><b>${peso(tu)}</b>Unilevel credited</div><div><b>${peso(ti)}</b>Indirect credited</div><div><b>${peso(sum(tg, tt, tr, tu, ti))}</b>total credited</div><div><b>${activeNow}</b>Unilevel active members</div><div><b>${depth()} / ${NQ && dep(top) ? "Level " + dep(top) : "none"}</b>deepest level (General / Team)</div></div>
${companyReport}
<div class="row">${cb("g", "cg", "Count General")}${cb("t", "ct", "Count Team")}${cb("r", "cr", "Count Royalty")}${cb("u", "cu", "Count Unilevel")}${cb("i", "ci", "Count Indirect Referral")}<span class="mut">Totals and ranking use the ticked streams.</span></div>
<div class="g2"><div class="pan"><h2>Your Harvest account</h2><p class="mut">Sponsor: ${U(me.sp).name}. Directs: ${myD}.</p>${mineH}</div>
<div class="pan"><h2>Your Royalty account</h2>${mineR}</div>
<div class="pan"><h2>Your Unilevel account</h2>${mineU}</div>
<div class="pan"><h2>Your Indirect Referral account</h2>${mineI}</div>
<div class="pan"><h2>Your total</h2><p>General <b>${peso(myG)}</b> + Team <b>${peso(myT)}</b> + Royalty <b>${peso(myR)}</b> + Unilevel <b>${peso(myU)}</b> + Indirect <b>${peso(myI)}</b> = <b>${peso(myTotal)}</b>${on.g && on.t && on.r && on.u && on.i ? "" : " (not all streams counted)"}</p><p class="mut">This is what counts toward your ranking in the members table below.</p></div></div>
<div class="pan"><h2>Grow the network</h2>
<form class="row" onsubmit="return under(this)"><input id="nn" data-f="nn" name="n" placeholder="Username (blank = auto-name)" autocomplete="off" aria-label="Username"><input class="n" name="c" type="number" min="1" max="20000" value="10" aria-label="How many"><select name="pat" data-f="pat" aria-label="Sponsor pattern, under you"><option value="random">Random</option><option value="balanced">Balanced</option><option value="chain">Chain</option></select><button data-f="bu">Register under me</button></form>
<p class="mut">A typed username registers one member under you. Leave it blank to add the given count under you, using the chosen pattern. Three directs qualify you for Harvest; ten make you a Royalty Leader.</p>
<form class="row" onsubmit="return netGrow(this)"><input class="n" name="c2" type="number" min="1" max="20000" value="100" aria-label="How many, whole network"><select name="pat2" data-f="pat2" aria-label="Sponsor pattern, whole network"><option value="random">Random</option><option value="balanced">Balanced</option><option value="chain">Chain</option></select><button class="sec" data-f="ng">Grow whole network</button></form>
<p class="mut"><b>Random</b> sponsors each new member under any existing one. <b>Balanced</b> fills the shallowest open slot first, 10 per member - good for both matrices and the rank ladder. <b>Chain</b> sponsors each new member under the last, so nobody reaches 3 directs, let alone 10.</p></div>
<div class="pan"><h2>Rank ladder</h2>${ladderT()}</div>
<div class="pan"><h2>Indirect Referral Bonus</h2>${indirectT()}<p class="mut">Paid instantly to each upline, up to 10 levels, the moment a new member registers under them at any depth - flat pesos, no quota, no rank required. A short chain near the top just pays fewer levels; nothing is redirected.</p></div>
<div class="pan"><h2>Unilevel Repeat-Purchase Bonus</h2>${unilevelT()}<p class="mut">Level 0 always pays, straight to the buyer. Levels 1-10 pay only if that particular upline is currently Active, which is decided once a month: everyone starts Active, and personally buying at least ${peso(UNILEVEL_QUOTA)} in a month keeps (or restores) Active status for the whole of the next month; falling short switches it to Inactive until quota is cleared again, regardless of rank. Unilevel pays instantly, the moment a purchase is recorded - it does not wait for "Advance month".</p></div>
${mp}
<div class="pan"><h2>Month ${S.month}</h2>
<form class="row" onsubmit="return doPurchase(this)"><input name="amt" type="number" min="1" step="1" placeholder="Amount (₱)" aria-label="Purchase amount" data-f="amt"><button data-f="rp">Record a purchase for me</button></form>
<p class="mut">Adds to your personal sales this month, feeds your upline's Royalty group sales, and pays Unilevel instantly to whichever of your uplines are currently Active.</p>
<button class="sec" onclick="doAutoPurchase()">Auto-purchase: simulate ~30% of the network buying</button>
<p class="mut">Picks a random ~30% of all members and records a ₱500–₱5,000 purchase for each. Every one of those purchases pays Unilevel in real time, exactly like the button above - it just runs it for many members in one click. See who it paid you from in the breakdown panel below.</p>
<button class="sec" onclick="doAdvance()">Advance month</button>
<p class="mut">Pays Royalty to Supervisors, Managers and Directors who cleared quota, then sets every member's Unilevel status (Active or Inactive) for next month from this month's personal sales - manual, Auto-purchase, or both. Creates no purchases and pays no Unilevel money itself; it only decides who's eligible starting next month. Does not affect the Harvest matrices.</p></div>
${apl}
${gp}${tp}${rtp}
${NQ ? `<div class="pan"><h2>Whole network: fill at the top of the matrix</h2>${lvT(levelsG(0))}</div>` : ""}
<div class="pan"><h2>Whole network this month</h2><p>Combined personal sales so far: <b>${peso(gsAll[0] || 0)}</b>. Last month, <b>${S.lastMonthCount || 0}</b> member${(S.lastMonthCount || 0) === 1 ? "" : "s"} earned Royalty totaling <b>${peso(S.lastMonthTotal || 0)}</b>, and Unilevel paid out <b>${peso(S.lastMonthUnilevelTotal || 0)}</b> across the network.</p></div>
<div class="pan"><h2>All members, richest first</h2><div class="sc"><table><caption class="sr">All members ranked by bonuses earned</caption><tr><th>Member</th><th>Sponsor</th><th>Directs</th><th>Position</th><th>Harvest team</th><th>Rank</th><th>Royalty team</th><th>General ₱</th><th>Team ₱</th><th>Royalty ₱</th><th>Unilevel ₱</th><th>Indirect ₱</th><th>Total ₱</th></tr>
${
  page("members", rows)
    .map(
      (r) =>
        `<tr class="${r.u.id === me.id ? "me" : ""}"><td><a href="#" onclick="S.me=${r.u.id};save();render();return false">${r.u.name}</a></td><td>${U(r.u.sp).name}</td><td>${r.d}</td><td>${r.q < 0 ? '<span class="mut">Not qualified</span>' : "#" + (r.q + 1) + (r.q ? ", under " + parentName(r.q) : " (apex)")}</td><td>${r.q < 0 ? "-" : r.n}</td><td>${r.rn}</td><td>${r.royaltyTeam}</td><td>${peso(r.g)}</td><td>${peso(r.t)}</td><td>${peso(r.royaltyE)}</td><td>${peso(r.unilevelE)}</td><td>${peso(r.indirectE)}</td><td>${peso(r.e)}</td></tr>`,
    )
    .join("") || '<tr><td colspan="13" class="mut">No members yet.</td></tr>'
}</table></div>
${pager("members", rows.length)}<p class="mut">Click a member's name to log in as them.</p></div>`;
      }

      // The logged-out page: just a register form and a log-in form, side by side, plus a hidden
      // <datalist> of every existing username so both forms get autocomplete. Note: this page's
      // <h1>/intro paragraph still describe the original three systems, predating Unilevel and Indirect
      // Referral - unlike the comment block at the very top of this file (which this documentation pass
      // corrected), this is user-FACING text, not a comment, so it was left alone here on the
      // assumption that wording changes to what players actually see need a deliberate decision, not a
      // documentation pass - worth updating to match the <title> tag, which already lists all five.
      function authView(m) {
        return `<h1>Harvest Simulator: General + Team + Royalty</h1>
<p class="mut">Register for free, sponsor members, and grow three income streams at once: the shared General Harvest matrix, your own Team Harvest matrix, and the Royalty rank ladder. Nothing here is real money. Data stays in this browser.</p>
${m ? `<p class="err">${m}</p>` : ""}${warn ? '<p class="mut">Browser storage is unavailable here, so data resets when this tab closes.</p>' : ""}
<div class="g2"><form class="pan" onsubmit="return doReg(this)"><h2>Register</h2><label>Username<input name="n" data-f="rn" autocomplete="off"></label><label>Sponsor<input name="s" data-f="rs" list="ul" value="company" autocomplete="off"></label><button>Register and log in</button></form>
<form class="pan" onsubmit="return doLogin(this)"><h2>Log in</h2><label>Username<input name="n" data-f="ln" list="ul" autocomplete="off"></label><button>Log in</button></form></div>
<datalist id="ul">${S.users.map((u) => `<option value="${u.name}">`).join("")}</datalist>`;
      }

      // ---- EVENT HANDLERS ----
      // Everything from here down is wired directly to an onclick or onsubmit attribute inside the
      // HTML strings dash()/authView() just built - these are the only functions a user action can
      // actually reach. Every one of them follows the same shape: read input -> mutate S -> save() ->
      // render() -> toast() a summary - and every one of them returns false from a form handler so the
      // browser doesn't also try to actually submit the form and reload the page.
      //
      // doReg(): the logged-out "Register" form. Registers a brand new member (reg()), logs them in
      // (S.me = their new id), and reports everything that one registration touched: Harvest
      // qualification/level completions (qmsg), a Royalty rank-up (rankMsg), and any Indirect Referral
      // payout (lastIndirect, stashed by reg() -> payIndirectReferral() during this same call).
      function doReg(f) {
        const bH = snap(),
          bR = rankSnap();
        const r = reg(f.n.value, f.s.value);
        if (typeof r === "string") {
          render(r);
          return false;
        }
        S.me = r.id;
        save();
        render();
        const iMsg =
          lastIndirect && lastIndirect.total > 0
            ? ` Indirect Referral paid <b>${peso(lastIndirect.total)}</b> across ${lastIndirect.dist.length} upline${lastIndirect.dist.length > 1 ? "s" : ""}.`
            : "";
        toast(
          `Registered <b>${r.name}</b> under <b>${U(r.sp).name}</b>. You are logged in.${qmsg(bH, r.id)}${rankMsg(bR, r.id)}${iMsg}`,
        );
        return false;
      }
      // doLogin(): the logged-out "Log in" form - just finds the member by username and sets S.me.
      function doLogin(f) {
        const u = byName(f.n.value);
        if (!u || !u.id) {
          render("No member with that username.");
          return false;
        }
        S.me = u.id;
        save();
        render();
        return false;
      }
      // under(): the logged-in "Register under me" form. Two modes in one handler, chosen by whether a
      // username was typed: a typed name registers exactly one member under the logged-in user,
      // reporting the same three-system breakdown as doReg() above; a blank name instead falls through
      // to doBulk() with the chosen pattern/count, scoped to the logged-in member's own team (root=
      // their id) rather than the whole network.
      function under(f) {
        const me = U(S.me);
        if (f.n.value.trim()) {
          const bH = snap(),
            bR = rankSnap();
          const r = reg(f.n.value, me.name);
          if (typeof r === "string") {
            render(r);
            return false;
          }
          save();
          f.n.value = "";
          render();
          const iMsg =
            lastIndirect && lastIndirect.total > 0
              ? ` Indirect Referral paid <b>${peso(lastIndirect.total)}</b> across ${lastIndirect.dist.length} upline${lastIndirect.dist.length > 1 ? "s" : ""}.`
              : "";
          toast(
            `Registered <b>${r.name}</b> under you.${qmsg(bH, me.id)}${rankMsg(bR, me.id)}${iMsg}`,
          );
          return false;
        }
        doBulk(
          f.pat.value,
          me.id,
          Math.max(1, Math.min(20000, +f.c.value || 1)),
          true,
        );
        return false;
      }
      // netGrow(): the "Grow whole network" form - always root=null, i.e. not scoped to anyone's team.
      function netGrow(f) {
        doBulk(
          f.pat2.value,
          null,
          Math.max(1, Math.min(20000, +f.c2.value || 1)),
          false,
        );
        return false;
      }
      // doBulk(): the shared bulk-registration path both under() (blank-name branch) and netGrow() call
      // into - runs bulkAdd(), then reports the batch's combined Harvest/Royalty/Indirect Referral
      // effect in one toast, the same before/after snapshot pattern doReg()/under() use for a single
      // registration.
      function doBulk(pattern, root, K, underMe) {
        const bH = snap(),
          bR = rankSnap();
        const { added, indirectTotal } = bulkAdd(pattern, root, K);
        save();
        render();
        toast(
          `Added <b>${added}</b> member${added === 1 ? "" : "s"} (${pattern} pattern${underMe ? ", under you" : ""}).${qmsg(bH, S.me)}${rankMsg(bR, S.me)}${indirectTotal > 0 ? ` Indirect Referral paid <b>${peso(indirectTotal)}</b> across the batch.` : ""}`,
        );
      }
      // doPurchase(): "Record a purchase for me" - the one manual way to feed Royalty's group sales and
      // trigger a real-time Unilevel payout for a chosen amount, as the logged-in member specifically.
      function doPurchase(f) {
        const r = recordPurchase(S.me, +f.amt.value);
        if (!r) {
          render("Enter a purchase amount greater than 0.");
          return false;
        }
        save();
        f.amt.value = "";
        render();
        const parts = [`<b>${peso(r.l0)}</b> to you`];
        if (r.paidCount)
          parts.push(
            `<b>${peso(r.upTotal)}</b> across ${r.paidCount} Active upline${r.paidCount > 1 ? "s" : ""}`,
          );
        if (r.skippedCount)
          parts.push(
            `${r.skippedCount} upline${r.skippedCount > 1 ? "s" : ""} skipped (not Active)`,
          );
        toast(
          `Recorded <b>${peso(r.amt)}</b> in personal purchases this month. Unilevel paid ${parts.join(", ")}.`,
        );
        return false;
      }
      // doAutoPurchase(): "Auto-purchase" - simulates many members buying at once (autoPurchasePass()),
      // deliberately separate from doAdvance() below (see the header comment's note on why they were
      // split). Still pays Unilevel in real time, exactly like doPurchase() above, just for everyone
      // the random pass picks instead of one chosen member and amount.
      function doAutoPurchase() {
        const before = S.unilevelEarned[S.me] || 0;
        const { buyers, total, unilevel } = autoPurchasePass();
        save();
        render();
        const mine = (S.unilevelEarned[S.me] || 0) - before;
        toast(
          `Auto-purchase: <b>${buyers}</b> member${buyers === 1 ? "" : "s"} bought, totaling <b>${peso(total)}</b>, generating <b>${peso(unilevel)}</b> in Unilevel, paid in real time as each purchase happened.${mine > 0 ? ` You personally earned <b>${peso(mine)}</b> from this pass.` : ""} See the breakdown below.`,
        );
      }
      // doAdvance(): "Advance month" - the only trigger for evaluateMonth(), i.e. the only thing that
      // pays Royalty or recomputes next month's Unilevel Active/Inactive flags. Creates no purchases
      // itself; whatever S.sales already holds (from doPurchase()/doAutoPurchase() calls made earlier
      // this month) is what gets evaluated.
      function doAdvance() {
        const before = S.earnedAll[S.me] || 0;
        const { total, count, unilevelTotal, activeNext } = evaluateMonth();
        save();
        render();
        const mine = (S.earnedAll[S.me] || 0) - before;
        toast(
          `Advanced to <b>Month ${S.month}</b>. ${count} member${count === 1 ? "" : "s"} earned Royalty totaling <b>${peso(total)}</b> for the month that just ended (Unilevel paid <b>${peso(unilevelTotal)}</b> total that month, in real time as it happened).${mine > 0 ? ` You earned <b>${peso(mine)}</b> in Royalty.` : ""} <b>${activeNext}</b> member${activeNext === 1 ? "" : "s"} will be Active for Unilevel next month.`,
        );
      }
      // reset(): the Reset button, with a one-click "arm" / second-click "confirm" guard (armed) so a
      // stray click can't silently wipe the whole simulation.
      function reset() {
        if (!armed) {
          armed = true;
          render("Click Reset again to erase all simulation data.");
          return;
        }
        armed = false;
        S = fresh();
        save();
        render();
      }
      // The single entry point that redraws the page after ANY state change - every event handler above
      // ends by calling save() then render(). view remembers whether the last render showed the
      // logged-in ("d") or logged-out ("a") page, purely so a SWITCH between the two (logging in or
      // out) can move keyboard focus to the new <h1>; it is not used for anything else.
      let view = null;
      function render(m) {
        if (m === undefined) armed = false;
        const v = S.me > 0 && U(S.me) ? "d" : "a";
        keep(() => {
          document.getElementById("root").innerHTML =
            v === "d" ? dash(m) : authView(m);
        });
        document.getElementById("alerts").textContent = m || "";
        if (view !== null && v !== view) {
          const h = document.querySelector("h1");
          h.tabIndex = -1;
          h.focus();
        }
        view = v;
      }
      render();
    </script>
  </body>
</html>
